# API NestJS. El Service se llama "api" porque es el target que
# scrapea Prometheus (api:3000) y el host que usa la BD (postgres:5432).
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: biblioteca
  labels:
    app: backend
    app.kubernetes.io/part-of: biblioteca
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: biblioteca
  labels:
    app: backend
    app.kubernetes.io/part-of: biblioteca
spec:
  # 1 réplica mientras DB_SYNCHRONIZE=true: dos Pods podrían intentar
  # crear el esquema simultáneamente en el primer arranque.
  # Escalar cuando se incorporen migraciones y DB_SYNCHRONIZE=false.
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/part-of: biblioteca
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: backend
          image: gabyjaurena/biblioteca-back:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DB_TYPE
              value: postgres
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: biblioteca-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biblioteca-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: biblioteca-secrets
                  key: POSTGRES_DB
            - name: DB_SSL
              value: "false"
            - name: DB_SYNCHRONIZE
              value: "true"
            - name: PORT
              value: "3000"
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
