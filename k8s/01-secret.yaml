# Credenciales del entorno. Para producción reemplazar por valores reales
# (o gestionar con SealedSecrets / External Secrets).
# Este archivo usa los mismos valores de laboratorio que docker-compose.yml.
apiVersion: v1
kind: Secret
metadata:
  name: biblioteca-secrets
  namespace: biblioteca
  labels:
    app.kubernetes.io/part-of: biblioteca
type: Opaque
stringData:
  POSTGRES_USER: sanderson
  POSTGRES_PASSWORD: "123456789"
  POSTGRES_DB: cosmere
  GRAFANA_ADMIN_USER: admin
  GRAFANA_ADMIN_PASSWORD: admin
