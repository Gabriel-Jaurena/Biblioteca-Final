# Opcional: requiere un Ingress Controller (por ejemplo nginx).
# Si no se usa Ingress, acceder con kubectl port-forward (ver README).
#
# El frontend se construye con:
#   --build-arg API_URL=http://api.biblioteca.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biblioteca
  namespace: biblioteca
  labels:
    app.kubernetes.io/part-of: biblioteca
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: biblioteca.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.biblioteca.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
