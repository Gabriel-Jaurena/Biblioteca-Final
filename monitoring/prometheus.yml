global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'biblioteca-monitor'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'biblioteca-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:3000']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
