# Netlify auto-instala este runtime solo al vincular un repo a un sitio NUEVO.
# Este sitio ya existía (creado con otro repo), así que hay que declararlo
# explícitamente para que se despliegue la Edge Function de SSR.
[[plugins]]
  package = "@netlify/angular-runtime"

# Fallback CSR para rutas profundas si el SSR no está disponible.
